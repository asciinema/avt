name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell:
        - default
        - msrv
    steps:
    - uses: actions/checkout@v6
    - uses: nixbuild/nix-quick-install-action@v34
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
    - run: nix develop .#${{ matrix.shell }} --command cargo test
    - name: Check supported targets and no_std
      run: |
        nix develop .#${{ matrix.shell }} --command cargo check --lib \
          --target x86_64-unknown-linux-gnu \
          --target aarch64-unknown-linux-gnu \
          --target aarch64-apple-darwin \
          --target wasm32-unknown-unknown \
          --target thumbv7em-none-eabi
    - name: Run examples
      run: |
        nix develop .#${{ matrix.shell }} --command bash -ec '
          for source in examples/*.rs; do
            cargo run --quiet --example "$(basename "$source" .rs)" </dev/null
          done
        '
