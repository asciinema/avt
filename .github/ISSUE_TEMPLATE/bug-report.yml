name: Bug Report
description: Report a bug to help improve avt
body:
  - type: markdown
    attributes:
      value: |
        **This is a bug tracker for avt (asciinema virtual terminal).**

        - If your issue is with the CLI recorder, the player, the server or agg, please open an issue in the related repository
        - For feature requests, questions, and discussions, use the [forum](https://discourse.asciinema.org) or [GitHub discussions](https://github.com/orgs/asciinema/discussions)

        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      description: Please confirm the following before submitting your bug report
      options:
        - label: I have searched existing issues and this bug has not been reported yet
          required: true
        - label: This is a bug report for the avt library itself (not the applications using it)
          required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal code example or input byte/escape sequence that triggers the problem
      placeholder: |
        ```rust
        let mut vt = avt::Vt::new(80, 24);
        vt.feed_str("...");
        // observe incorrect terminal state
        ```
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen, e.g. how a reference terminal emulator (xterm, Ghostty, Alacritty) handles the same input.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: input
    id: avt-version
    attributes:
      label: avt Version
      description: What version of avt are you using?
      placeholder: e.g., 0.16.0, or a git commit hash
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or relevant information about the problem here.
