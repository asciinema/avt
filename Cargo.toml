[package]
name = "avt"
version = "0.19.0"
edition = "2024"
authors = ["Marcin Kulik <m@ku1ik.com>"]
repository = "https://github.com/asciinema/avt"
description = "asciinema virtual terminal"
license = "Apache-2.0"
exclude = [
    "/.github/**",
    "/.gitignore",
    "/flake.lock",
    "/flake.nix",
    "/fuzz.sh",
]

# MSRV
rust-version = "1.86.0"

[dependencies]
unicode-width = "0.2"

[dev-dependencies]
proptest = "1"
criterion = "0.8"
pretty_assertions = "1.0"

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "terminal"
harness = false

[[bench]]
name = "charset"
harness = false
