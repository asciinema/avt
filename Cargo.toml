[package]
name = "avt"
version = "0.18.0"
edition = "2024"
authors = ["Marcin Kulik <m@ku1ik.com>"]
repository = "https://github.com/asciinema/avt"
description = "asciinema virtual terminal"
license = "Apache-2.0"

# MSRV
rust-version = "1.86.0"

[dependencies]
rgb = "0.8.33"
unicode-width = "0.1.13"

[dev-dependencies]
rand = "0.10"
proptest = "1"
criterion = "0.8"
pretty_assertions = "1.0"

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "vt"
harness = false

[[bench]]
name = "charset"
harness = false
